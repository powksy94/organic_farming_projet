<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TerraView — Surveillance agricole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#FAFAF7">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#FAFAF7"/>
    <g transform="translate(600 400)">
      <rect x="-90" y="-90" width="180" height="180" rx="36" fill="#0F1511"/>
      <g transform="translate(-44 -44) scale(3.6)" fill="none" stroke="#FAFAF7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 19c0-9 6-15 15-15 0 9-6 15-15 15z"/>
        <path d="M5 19c4-4 7-7 11-11"/>
      </g>
    </g>
    <text x="600" y="640" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="600" fill="#0F1511">TerraView</text>
  </svg>
</template>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script src="api.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="parcels.jsx"></script>
<script type="text/babel" src="obs-alerts.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": false,
  "font": "Inter"
}/*EDITMODE-END*/;

const FONT_STACKS = {
  "Inter": "'Inter', system-ui, sans-serif",
  "IBM Plex Sans": "'IBM Plex Sans', system-ui, sans-serif",
  "Instrument Serif": "'Instrument Serif', Georgia, serif",
  "System": "system-ui, -apple-system, sans-serif",
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = useState({ name: "home" });
  const [parcelles, setParcelles] = useState(TV_DATA.parcelles);
  const [alertes, setAlertes] = useState(TV_DATA.alertes);
  const [observations, setObservations] = useState(TV_DATA.observations);
  const [openObsForm, setOpenObsForm] = useState(false);
  const [toast, setToast] = useState(null);
  const [apiOk, setApiOk] = useState(null);

  // Charge les données depuis le back FastAPI
  function reloadFromApi() {
    if (!window.TV_API) return;
    return TV_API.loadAll().then(d => {
      setParcelles(d.parcelles);
      setAlertes(d.alertes);
      setObservations(d.observations);
      setApiOk(true);
    }).catch(err => {
      console.warn('API down, fallback données démo:', err.message);
      setApiOk(false);
    });
  }

  useEffect(() => { reloadFromApi(); }, []);

  // Expose alertes globalement pour la cloche de notif
  useEffect(() => {
    window.__TV_ALERTS__ = alertes;
    window.__TV_SET_ROUTE__ = setRoute;
    window.__TV_RELOAD__ = reloadFromApi;
  }, [alertes]);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", t.dark ? "dark" : "light");
  }, [t.dark]);

  useEffect(() => {
    document.body.style.fontFamily = FONT_STACKS[t.font] || FONT_STACKS.Inter;
  }, [t.font]);

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  }

  function treatAlert(id) {
    const a = alertes.find(x => x.id === id);
    setAlertes(alertes.map(x => x.id === id ? { ...x, statut: "traité" } : x));
    showToast("Alerte marquée comme traitée");
    if (a && a._api_id && window.TV_API) {
      TV_API.resolveAlert(a._api_id).catch(e => console.warn('resolve failed', e));
    }
  }
  function reopenAlert(id) {
    setAlertes(alertes.map(a => a.id === id ? { ...a, statut: "nouveau" } : a));
    showToast("Alerte rouverte (local)");
  }
  function addObservation(o) {
    setObservations([o, ...observations]);
    showToast("Observation enregistrée");
    // POST API si on a une parcelle réelle
    if (window.TV_API && o.parcelle) {
      const plot = parcelles.find(p => p.nom === o.parcelle);
      if (plot && plot._api_id) {
        TV_API.createObservation({
          date: new Date().toISOString().slice(0, 10),
          state: o.type || 'Observation',
          plot_id: plot._api_id,
          comment: o.notes || '',
        }).then(() => reloadFromApi())
          .catch(e => console.warn('obs create failed', e));
      }
    }
  }

  function selectParcel(id) {
    setRoute({ name: "parcel", id });
  }

  let screen;
  const alertCount = alertes.filter(a => a.statut === "nouveau").length;

  if (route.name === "home") {
    screen = <Dashboard parcelles={parcelles} alertes={alertes} setRoute={setRoute} onSelectParcel={selectParcel} onTreat={treatAlert} />;
  } else if (route.name === "parcels") {
    screen = <ParcelsScreen parcelles={parcelles} setRoute={setRoute} />;
  } else if (route.name === "parcel") {
    const p = parcelles.find(x => x.id === route.id);
    screen = <ParcelDetail parcelle={p} alertes={alertes} observations={observations} setRoute={setRoute} />;
  } else if (route.name === "obs") {
    screen = <ObservationsScreen observations={observations} parcelles={parcelles} onAdd={addObservation} openForm={openObsForm} setOpenForm={setOpenObsForm} />;
  } else if (route.name === "alerts") {
    screen = <AlertsScreen alertes={alertes} onTreat={treatAlert} onReopen={reopenAlert} />;
  } else if (route.name === "settings") {
    screen = <SettingsScreen />;
  }

  // data-screen-label for context
  const screenLabel = {
    home: "01 Dashboard",
    parcels: "02 Mes parcelles",
    parcel: "03 Détail parcelle",
    obs: "04 Observations",
    alerts: "05 Alertes",
    settings: "06 Paramètres",
  }[route.name];

  return (
    <div className="app">
      <Sidebar route={route} setRoute={setRoute} alertCount={alertCount} />
      <main className="main" data-screen-label={screenLabel}>
        {screen}
      </main>
      {toast && <div className="toast"><Ic.check width="14" height="14" style={{verticalAlign:"middle", marginRight:6}}/>{toast}</div>}
      <TweaksPanel>
        <TweakSection label="Apparence" />
        <TweakToggle label="Mode sombre" value={t.dark} onChange={(v) => setTweak('dark', v)} />
        <TweakSection label="Typographie" />
        <TweakSelect label="Police"
          value={t.font}
          options={["Inter", "IBM Plex Sans", "Instrument Serif", "System"]}
          onChange={(v) => setTweak('font', v)} />
      </TweaksPanel>
    </div>
  );
}

// ───────────── Login simple ─────────────
const USERS = {
  "g":     { password: "projetdtude", name: "Guillaume" },
  "powksy":{ password: "projetdtude", name: "Powksy" },
  "team":  { password: "projetdtude", name: "Équipe TerraView" },
};

function Login({ onLogin }) {
  const [u, setU] = useState("");
  const [p, setP] = useState("");
  const [err, setErr] = useState("");

  function submit(e) {
    e.preventDefault();
    const user = USERS[u.trim().toLowerCase()];
    if (user && user.password === p) {
      sessionStorage.setItem("tv_user", JSON.stringify({ login: u, name: user.name }));
      onLogin(user.name);
    } else {
      setErr("Identifiants incorrects");
    }
  }

  return (
    <div style={{
      minHeight: "100vh", display: "grid", placeItems: "center",
      background: "var(--bg)", padding: 20
    }}>
      <form onSubmit={submit} className="card" style={{ width: 360, padding: 28 }}>
        <div style={{ textAlign: "center", marginBottom: 22 }}>
          <div style={{
            width: 48, height: 48, margin: "0 auto 12px", borderRadius: 12,
            background: "var(--ink)", display: "grid", placeItems: "center", color: "var(--bg)"
          }}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M5 19c0-9 6-15 15-15 0 9-6 15-15 15z"/>
              <path d="M5 19c4-4 7-7 11-11"/>
            </svg>
          </div>
          <div style={{ fontSize: 20, fontWeight: 600 }}>TerraView</div>
          <div style={{
            fontSize: 13, color: "var(--ink-2)", marginTop: 6,
            fontStyle: "italic", letterSpacing: "-0.01em"
          }}>
            Cultivez vos données, récoltez l'avenir.
          </div>
        </div>

        <div style={{ marginBottom: 14 }}>
          <label style={{ fontSize: 11.5, color: "var(--ink-3)", fontWeight: 500, display: "block", marginBottom: 5 }}>
            Identifiant
          </label>
          <input className="form-input" autoFocus
                 value={u} onChange={e => setU(e.target.value)}
                 placeholder="G" />
        </div>

        <div style={{ marginBottom: 14 }}>
          <label style={{ fontSize: 11.5, color: "var(--ink-3)", fontWeight: 500, display: "block", marginBottom: 5 }}>
            Mot de passe
          </label>
          <input type="password" className="form-input"
                 value={p} onChange={e => setP(e.target.value)} />
        </div>

        {err && (
          <div style={{
            background: "var(--red-soft)", color: "var(--red)",
            padding: "8px 10px", borderRadius: 8, fontSize: 12, marginBottom: 12
          }}>{err}</div>
        )}

        <button type="submit" className="btn" style={{ width: "100%", justifyContent: "center" }}>
          Se connecter
        </button>

        <div style={{
          marginTop: 18, paddingTop: 14, borderTop: "1px solid var(--line-2)",
          fontSize: 11, color: "var(--ink-3)", textAlign: "center"
        }}>
          Comptes : <code>G</code>, <code>powksy</code>, <code>team</code> · mdp <code>projetdtude</code>
        </div>
      </form>
    </div>
  );
}

function Root() {
  const [user, setUser] = useState(() => {
    const saved = sessionStorage.getItem("tv_user");
    return saved ? JSON.parse(saved).name : null;
  });

  if (!user) return <Login onLogin={setUser} />;
  return <App />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
